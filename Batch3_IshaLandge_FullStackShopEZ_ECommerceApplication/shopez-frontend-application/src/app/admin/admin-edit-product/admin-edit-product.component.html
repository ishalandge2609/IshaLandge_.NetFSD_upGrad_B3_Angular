<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
  <h1 class="h2">Edit Product</h1>
  <div class="btn-toolbar mb-2 mb-md-0">
    <a routerLink="/admin/products" class="btn btn-sm btn-secondary">
      <i class="bi bi-arrow-left me-1"></i> Back to Products
    </a>
  </div>
</div>

<div *ngIf="loading" class="text-center py-5">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<div *ngIf="!loading && product" class="card">
  <div class="card-body">
    <form #productForm="ngForm" (ngSubmit)="onSubmit()">
      <!-- Product Name -->
      <div class="mb-3">
        <label class="form-label">Product Name *</label>
        <input type="text" class="form-control" [(ngModel)]="editData.name" name="name" required minlength="3">
      </div>
      
      <!-- Description -->
      <div class="mb-3">
        <label class="form-label">Description *</label>
        <textarea class="form-control" [(ngModel)]="editData.description" name="description" rows="4" required></textarea>
      </div>
      
      <div class="row">
        <!-- Price -->
        <div class="col-md-3 mb-3">
          <label class="form-label">Price (₹) *</label>
          <input type="number" class="form-control" [(ngModel)]="editData.price" name="price" required min="0" step="1">
        </div>
        
        <!-- Stock -->
        <div class="col-md-3 mb-3">
          <label class="form-label">Stock Quantity *</label>
          <input type="number" class="form-control" [(ngModel)]="editData.stock" name="stock" required min="0">
        </div>
        
        <!-- Category -->
        <div class="col-md-3 mb-3">
          <label class="form-label">Category *</label>
          <select class="form-select" [(ngModel)]="editData.category" name="category" required>
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>
        
        <!-- Image URL -->
        <div class="col-md-3 mb-3">
          <label class="form-label">Image URL</label>
          <input type="text" class="form-control" [(ngModel)]="editData.imageUrl" name="imageUrl">
          <small class="text-muted">Example: /images/table.jpg</small>
        </div>
      </div>
      
      <div class="mt-3">
        <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
          {{ isSubmitting ? 'Updating...' : 'Update Product' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/admin/products">Cancel</button>
      </div>
    </form>
  </div>
</div>
