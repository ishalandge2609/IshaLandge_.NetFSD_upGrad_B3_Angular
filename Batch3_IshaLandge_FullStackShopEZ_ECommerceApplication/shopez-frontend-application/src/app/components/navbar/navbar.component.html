<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" routerLink="/home">
      <i class="bi bi-stars"></i>Shop<span>EZ</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-2">

        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">
            <i class="bi bi-house-door me-2"></i>Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active">
            <i class="bi bi-bag-check me-2"></i>Products
          </a>
        </li>

        <!-- Admin Dropdown -->
        <li class="nav-item dropdown" *ngIf="authService.isAdmin()">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
            <i class="bi bi-shield-lock me-2"></i>Admin
          </a>

          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" routerLink="/admin/dashboard">
                Dashboard
              </a>
            </li>

            <li>
              <a class="dropdown-item" routerLink="/admin/products">
                Products
              </a>
            </li>

            <li>
              <a class="dropdown-item" routerLink="/admin/orders">
                Orders
              </a>
            </li>

            <li>
              <a class="dropdown-item" routerLink="/admin/users">
                Users
              </a>
            </li>
          </ul>
        </li>

        <!-- Logged In -->
        <ng-container *ngIf="authService.isLoggedIn(); else loggedOut">

          <li class="nav-item">
            <a class="nav-link" routerLink="/my-orders" routerLinkActive="active">
              <i class="bi bi-box-seam me-2"></i>My Orders
            </a>
          </li>

          <li class="nav-item">
            <button class="btn btn-link nav-link" (click)="logout()">
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </button>
          </li>

        </ng-container>

        <!-- Logged Out -->
        <ng-template #loggedOut>

          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">
              <i class="bi bi-person me-2"></i>Login
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">
              <i class="bi bi-person-plus me-2"></i>Register
            </a>
          </li>

        </ng-template>

        <!-- Cart -->
        <li class="nav-item">
          <a routerLink="/cart" class="cart-link">
            <i class="bi bi-cart3"></i>

            <span>Cart</span>

            <span
              id="cart-count"
              [style.display]="(cartService.cartCount() > 0) ? 'inline-flex' : 'none'">

              {{ cartService.cartCount() }}

            </span>
          </a>
        </li>

      </ul>
    </div>
  </div>
</nav>
