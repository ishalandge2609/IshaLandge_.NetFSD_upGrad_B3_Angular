services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: shopez-sqlserver

    environment:
      SA_PASSWORD: "YourStrongPassword123!"
      ACCEPT_EULA: "Y"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - shopez-network

    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  authservice:
    build:
      context: ../ECommerceMicroservices/AuthService.API
      dockerfile: Dockerfile

    container_name: authservice

    depends_on:
      sqlserver:
        condition: service_healthy

    ports:
      - "7182:8080"

    networks:
      - shopez-network

  productservice:
    build:
      context: ../ECommerceMicroservices/ProductService.API
      dockerfile: Dockerfile

    container_name: productservice

    depends_on:
      sqlserver:
        condition: service_healthy

    ports:
      - "7210:8080"

    networks:
      - shopez-network

  orderservice:
    build:
      context: ../ECommerceMicroservices/OrderService.API
      dockerfile: Dockerfile

    container_name: orderservice

    depends_on:
      sqlserver:
        condition: service_healthy

    ports:
      - "7238:8080"

    networks:
      - shopez-network

  apigateway:
    build:
      context: ../ECommerceMicroservices/APIGateway
      dockerfile: Dockerfile

    container_name: apigateway

    depends_on:
      - authservice
      - productservice
      - orderservice

    ports:
      - "7070:8080"

    networks:
      - shopez-network

  frontend:
    build:
      context: ../shopez-frontend-application
      dockerfile: Dockerfile

    container_name: frontend

    depends_on:
      - apigateway

    ports:
      - "4200:80"

    networks:
      - shopez-network

volumes:
  sqlserver_data:

networks:
  shopez-network: